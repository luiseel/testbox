services:
  redis:
    image: redis:7-alpine
    # Workers on other hosts connect to this port, so set TESTBOX_REDIS_PASSWORD
    # on a LAN. Empty means no password (local development only).
    environment:
      TESTBOX_REDIS_PASSWORD: ${TESTBOX_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes $${TESTBOX_REDIS_PASSWORD:+--requirepass "$$TESTBOX_REDIS_PASSWORD"}
    ports:
      - '${TESTBOX_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', '[ -z "$$TESTBOX_REDIS_PASSWORD" ] || export REDISCLI_AUTH="$$TESTBOX_REDIS_PASSWORD"; redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      PORT: 3000
      REDIS_URL: redis://:${TESTBOX_REDIS_PASSWORD:-}@redis:6379
      TESTBOX_KEY_PREFIX: testbox
      # Share this directory with the macOS worker (see docs/machine-setup.md).
      TESTBOX_DATA_DIR: /data
      TESTBOX_WORKER_TOKEN: ${TESTBOX_WORKER_TOKEN:-dev-worker-token}
      # Admin token used to create users and mint their tokens (POST /v1/users, /v1/users/:id/tokens).
      TESTBOX_BOOTSTRAP_TOKEN: ${TESTBOX_BOOTSTRAP_TOKEN:-}
    ports:
      - '${TESTBOX_API_PORT:-3000}:3000'
    volumes:
      - ${TESTBOX_DATA_DIR:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
